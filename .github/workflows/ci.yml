name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # samply is pinned in mise.toml for profiling on our machines; CI never profiles, so it
  # isn't installed there.
  MISE_DISABLE_TOOLS: "cargo:samply"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux only for now: macOS and Windows return when a milestone brings those platforms.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace --all-features --profile ci --no-tests=warn
      - run: cargo test --workspace --doc --all-features

  perf:
    # Runs the performance suite on a tiny project: it checks the suite works end to end. No
    # timings: shared runners are too noisy to measure on, so the tiny run records nothing and
    # compares nothing. The stage bench is built first exactly as perf builds it (every bench's
    # code is already checked by clippy --all-targets in the lint job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run -p geom --bench stages --features bench-stages
      - run: cargo run -p brushcraft-bench -- perf --tiny

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cargo deny check
      - run: cargo machete
