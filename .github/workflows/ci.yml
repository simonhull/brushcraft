name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # samply is pinned in mise.toml for profiling on our machines; CI never profiles, so it
  # isn't installed there. Nor are the verification tools: weekly.yml runs mutants and
  # coverage, and fuzzing and the proofs run on our machines.
  MISE_DISABLE_TOOLS: "cargo:samply,cargo:cargo-bolero,cargo:cargo-fuzz,cargo:cargo-mutants,cargo:cargo-llvm-cov,cargo:kani-verifier"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: test -n "$RUSTFMT" && test -n "$BRUSHCRAFT_NIGHTLY" && "$RUSTFMT" --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features
      # Private items too, test code included: their links are checked like the public ones'.
      - run: cargo doc --workspace --no-deps --document-private-items --all-features
        env:
          RUSTDOCFLAGS: --cfg test -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux only for now: macOS and Windows return when a milestone brings those platforms.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo nextest run --workspace --all-features --profile ci --no-tests=warn
      - run: cargo test --workspace --doc --all-features

  perf:
    # Runs the performance suite on a tiny project: it checks the suite works end to end. No
    # timings: shared runners are too noisy to measure on, so the tiny run records nothing and
    # compares nothing. The stage bench is built first exactly as perf --tiny builds it, in the
    # bench-fast profile (every bench's code is already checked by clippy --all-targets in the
    # lint job).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench --no-run --profile bench-fast -p geom --bench stages --features bench-stages
      - run: cargo run -p brushcraft-bench -- perf --tiny

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: cargo deny check
      - run: cargo machete
