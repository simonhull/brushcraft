name: Weekly

# The slow verification, on a schedule and by hand, never gating a merge: test strength
# (cargo-mutants), a coverage map (cargo-llvm-cov), and the many-seed tests every run skips.
# Read the reports; a survivor or an uncovered line is a lead, not a failure.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned in mise.toml for our machines: profiling, shader builds, fuzzing and the proofs aren't
  # run here.
  MISE_DISABLE_TOOLS: "cargo:samply,cargo:cargo-gpu,cargo:cargo-bolero,cargo:cargo-fuzz,cargo:kani-verifier"

jobs:
  mutants:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # GPU tests run on lavapipe (software Vulkan), and only on it, as in check.sh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: |
          icd=$(scripts/lavapipe.sh)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      # Settings in .cargo/mutants.toml. Survivors make cargo-mutants exit non-zero: reported,
      # not gating.
      - run: cargo mutants --workspace --shard ${{ matrix.shard }}/4 --timeout-multiplier 3
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # GPU tests run on lavapipe (software Vulkan), and only on it, as in check.sh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: |
          icd=$(scripts/lavapipe.sh)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      # A map, with no threshold. Code that runs only in the crash tests' children
      # (project/tests/crash.rs) shows as uncovered: they are killed with SIGKILL, so their
      # counters are never written.
      - run: cargo llvm-cov nextest --workspace --all-features --profile coverage --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The ignored `*_for_many_seeds` tests: more seeds of tests every run makes. The
      # differential one takes 15 minutes on the 32-core dev box; far longer on a runner.
      - run: cargo nextest run --workspace --all-features --profile slow --run-ignored only -E 'test(many_seeds)'
