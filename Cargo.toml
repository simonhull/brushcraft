[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
geom = { path = "crates/geom" }
store = { path = "crates/store" }
input = { path = "crates/input" }
brush = { path = "crates/brush" }
sculpt = { path = "crates/sculpt" }
anyhow = "1.0.100"
# 0.13.4, not 0.13.7: bolero-generator-derive 0.13.5 (pulled in by bolero 0.13.5 and later) pins
# indexmap to exactly 2.11.2, and wgpu 30 needs 2.11.4 or later. Return to the latest once the
# derive crate drops that pin. cargo-bolero 0.13.5 drives 0.13.4 fine.
bolero = "0.13.4"
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc", "min_const_generics"] }
divan = "0.1.21"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "param", "std"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
thiserror = "2.0.21"
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
# Exact: every wgpu major breaks the API. Vulkan and Metal (Linux, Android, macOS, iOS); WGSL
# shaders, and SPIR-V through naga's front end (the rust-gpu spike). No GL, DX12 or browser
# backends yet.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "spirv"] }
# Exact: a pre-release; a caret would float to later betas.
winit = { version = "=0.31.0-beta.3", default-features = false, features = ["wayland", "wayland-dlopen"] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# `kani` is set by `cargo kani` (the proofs), `fuzzing` by cargo-fuzz and `cargo bolero`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(fuzzing)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Nursery lints left off: noisy, or wrong for this codebase.
missing_const_for_fn = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow" # conflicts with rustc's unreachable_pub
suboptimal_flops = "allow" # suggests mul_add, a slow libm call without FMA
cognitive_complexity = "allow"
# Restriction lints, opted into one by one.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
assertions_on_result_states = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_inherent_impl = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
semicolon_if_nothing_returned = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

[profile.dev]
opt-level = 1

# Dependencies are compiled once, so optimize them even in dev builds; tests on large meshes stay usable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"

# The stage benches in the gate's `perf --tiny`, which records nothing: thin LTO builds faster.
# Recorded numbers always come from `bench`.
[profile.bench-fast]
inherits = "bench"
lto = "thin"
codegen-units = 16

# `cargo bolero test` builds its harnesses in this profile (it requires one by this name).
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
