[package]
name = "brushcraft-bench"
description = "The M0 benchmark harness: generates the benchmark sphere and measures page-in, brush steps, saves and the memory budget on it; runs the tracked performance suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The display-tile encoding study (`display-study`), with the codecs it measures and didn't
# choose. Off by default, so builds of the workspace never compile those codecs:
# `cargo run --release -p brushcraft-bench --features display-study -- display-study`.
display-study = ["geom/display-study", "dep:zstd"]

[dependencies]
anyhow.workspace = true
checkout.workspace = true
geom.workspace = true
rustix = { workspace = true, features = ["process", "thread"] }
sculpt.workspace = true
store = { workspace = true, features = ["bench"] }
thiserror.workspace = true
zstd = { workspace = true, optional = true }
