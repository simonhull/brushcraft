[package]
name = "geom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Base mesh, Catmull–Clark subdivision, correction pyramid, tile math and quantization."

[lints]
workspace = true

[features]
# Meshes for the tests of the crates above (`geom::fixtures`), turned on in their
# dev-dependencies only, so release builds never compile them.
test-fixtures = []
# The stages of a prediction one at a time (`geom::stages`), for `benches/stages.rs` only.
bench-stages = []

[dependencies]
bytemuck.workspace = true
thiserror.workspace = true

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "evaluate"
harness = false

[[bench]]
name = "stages"
harness = false
required-features = ["bench-stages"]
