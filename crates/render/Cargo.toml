[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The wgpu renderer: opens a GPU device and runs compute and drawing work on it."

[lints]
workspace = true

[features]
# M1a's spikes (src/spike): built and tested by the gate, left out of the shipped renderer.
spike = ["dep:brush", "dep:geom"]

[dependencies]
brush = { workspace = true, optional = true }
bytemuck.workspace = true
geom = { workspace = true, optional = true }
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
divan.workspace = true
geom = { workspace = true, features = ["test-fixtures"] }
rayon.workspace = true

[[bench]]
name = "brush_gpu"
harness = false
required-features = ["spike"]

[[bench]]
name = "eval_gpu"
harness = false
required-features = ["spike"]
