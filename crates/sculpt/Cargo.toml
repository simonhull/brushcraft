[package]
name = "sculpt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Brushes: steps that edit a project's corrections through its store and spatial index."

[lints]
workspace = true

[features]
# `Preview::forget_seams` and `Preview::seams_kept`: what the app's tests need to show that what
# a stitch keeps between calls changes nothing drawn. Turned on by tests only.
test-hooks = []

[dependencies]
bytemuck.workspace = true
geom.workspace = true
brush.workspace = true
store.workspace = true
stroke.workspace = true
thiserror.workspace = true

[dev-dependencies]
divan.workspace = true
geom = { workspace = true, features = ["test-fixtures"] }
store = { workspace = true, features = ["test-oracle"] }

[[bench]]
name = "draw_step"
harness = false

[[bench]]
name = "preview"
harness = false
