[package]
name = "store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Project file, out-of-core tile paging, tile pool, cache budget and spatial index."

[lints]
workspace = true

[features]
# What the whole-file fuzz target needs from inside the crate (`store::fuzzing`), turned on by
# the fuzz crate only, so release builds never compile it.
fuzzing = []
# What `brushcraft-bench` needs to time the display layer level by level
# (`TileStore::queue_display_level`) and what `benches/stroke_record.rs` times
# (`StrokeRecord::framed_len`), turned on by the benches only.
bench = []

[dependencies]
bytemuck.workspace = true
geom.workspace = true
rayon.workspace = true
thiserror.workspace = true
zstd.workspace = true

# Opening a path a file names without blocking (see `file`); on Linux and Android, counting
# physical cores also reads the process's CPU affinity mask (see `workers`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
bolero.workspace = true
divan.workspace = true
geom = { workspace = true, features = ["test-fixtures"] }

[[bench]]
name = "recovery"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "display_draw"
harness = false

# Needs `StrokeRecord::framed_len`, built with the `bench` feature only.
[[bench]]
name = "stroke_record"
harness = false
required-features = ["bench"]
