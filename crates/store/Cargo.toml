[package]
name = "store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Project file, out-of-core tile paging, tile pool, cache budget and spatial index."

[lints]
workspace = true

[dependencies]
bytemuck.workspace = true
geom.workspace = true
rayon.workspace = true
thiserror.workspace = true
zstd.workspace = true

# Opening a path a file names without blocking (see `file`); on Linux and Android, counting
# physical cores also reads the process's CPU affinity mask (see `workers`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
bolero.workspace = true
divan.workspace = true
geom = { workspace = true, features = ["test-fixtures"] }

[[bench]]
name = "recovery"
harness = false

[[bench]]
name = "index"
harness = false
