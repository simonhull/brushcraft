[graph]
all-features = true
# The platforms on the roadmap: Linux first, then Android, Windows, macOS and iOS.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
]

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only, so every licensing option stays open.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
