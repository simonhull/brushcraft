# Single source of truth for the toolchain: here, on Kit and in CI.
# Bump `rust` together with `rust-version` in Cargo.toml.
[tools]
# The first version is the default. The pinned nightly is only for rustfmt's unstable options and Miri;
# keep it in step with BRUSHCRAFT_NIGHTLY below.
rust = [
  { version = "1.99.1", components = "rustfmt,clippy,llvm-tools-preview", profile = "minimal" },
  { version = "nightly-2026-10-15", components = "rustfmt,miri,rust-src", profile = "minimal" },
]
cargo-binstall = "1.26.0"
"cargo:cargo-nextest" = "0.9.148"
"cargo:cargo-machete" = "0.9.2"
cargo-deny = "0.20.2"
"cargo:samply" = "0.13.1"
# Builds the rust-gpu shaders (crates/render/shaders/build.sh), which bring their own nightly
# through rustup; the gate loads the checked-in SPIR-V, so CI leaves it out.
"cargo:cargo-gpu" = "0.10.0"
# Verification tooling (see CLAUDE.md "Commands"): property tests run under bolero, whole files
# under cargo-fuzz, test strength under cargo-mutants, coverage under cargo-llvm-cov, and the
# integer proofs under Kani. CI's everyday jobs leave the fuzzers and Kani out (MISE_DISABLE_TOOLS).
"cargo:cargo-bolero" = "0.13.5"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:kani-verifier" = "0.68.0"

[env]
BRUSHCRAFT_NIGHTLY = "nightly-2026-10-15"
# `cargo fmt` formats with the pinned nightly's rustfmt (see rustfmt.toml).
RUSTFMT = "{{config_root}}/scripts/rustfmt"
